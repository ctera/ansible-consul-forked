---
name: Molecule

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - centos-stream-9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Molecule
        uses: gofrolist/molecule-action@v2.7.6
        with:
          molecule_options: --base-config molecule/_shared/base.yml
          molecule_args: --scenario-name ${{ matrix.scenario }}
