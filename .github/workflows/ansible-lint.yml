---
name: Ansible Lint

on:
  push:
    branches: [master]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [master]

jobs:
  ansible-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Temporary fix for roles
        run: |
          mkdir -p /home/runner/.ansible/roles
          ln -s /home/runner/work/ansible-consul-forked/ansible-consul-forked /home/runner/.ansible/roles/ansible-consul

      - name: Lint Ansible Playbook
        uses: ansible/ansible-lint@v6
